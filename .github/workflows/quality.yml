# Workflow reutilizable (harvis-standards v2). En cada repo, .github/workflows/ci.yml:
#   jobs:
#     quality:
#       uses: bryan56gm/harvis-standards/.github/workflows/quality.yml@v2
#       with: { run-tests: true, max-warnings: 0, knip: false, build: true }
# `v2` es una etiqueta flotante que sigue al último 2.x; `vX.Y.Z` fija una versión.
name: quality
on:
  workflow_call:
    inputs:
      run-tests:
        type: boolean
        default: true
      max-warnings:
        description: Trinquete de warnings. 0 cuando el repo sale de `legacy`.
        type: number
        default: 50
      knip:
        description: Código muerto (pnpm knip). Opt-in.
        type: boolean
        default: false
      build:
        description: >-
          pnpm build. Apágalo si el build necesita variables de entorno (Next con
          Supabase/Sentry): un workflow reutilizable no recibe env del repo, así que
          ese build vive en un job propio del repo con sus secretos.
        type: boolean
        default: true
      node-version:
        type: string
        default: "22"
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ inputs.node-version }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint . --max-warnings ${{ inputs.max-warnings }}
      - run: pnpm exec tsc --noEmit
      - if: ${{ inputs.run-tests }}
        run: pnpm test --if-present
      - if: ${{ inputs.knip }}
        run: pnpm exec knip
      - if: ${{ inputs.build }}
        run: pnpm build --if-present
