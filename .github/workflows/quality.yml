# Workflow reutilizable (harvis-standards v2). En cada repo, .github/workflows/ci.yml:
#   jobs:
#     quality:
#       uses: bryan56gm/harvis-standards/.github/workflows/quality.yml@v2
#       with: { run-tests: true, max-warnings: 0, knip: false, build: true }
# `v2` es una etiqueta flotante que sigue al último 2.x; `vX.Y.Z` fija una versión.
name: quality
on:
  workflow_call:
    inputs:
      run-tests:
        type: boolean
        default: true
      max-warnings:
        description: Trinquete de warnings. 0 cuando el repo sale de `legacy`.
        type: number
        default: 50
      knip:
        description: Código muerto (pnpm knip). Opt-in.
        type: boolean
        default: false
      build:
        description: >-
          pnpm build. Apágalo si el build necesita variables de entorno (Next con
          Supabase/Sentry): un workflow reutilizable no recibe env del repo, así que
          ese build vive en un job propio del repo con sus secretos.
        type: boolean
        default: true
      presupuesto-segundos:
        description: >-
          Regla de oro: este job no pasa de 5 minutos. Si los pasa, FALLA.

          No es una metrica que alguien mira de vez en cuando: es un check. Un
          CI que se va a quince minutos no se arregla nunca —cada quien que lo
          sufre decide que hoy no le toca a el— y acaba saltandose con
          `--no-verify` o ignorandose del todo, que es como se llega a mergear
          sin verificar. Tenerlo como fallo obliga a arreglarlo el dia que se
          rompe, cuando todavia se sabe que cambio lo rompio.

          Se sube con un PR y su motivo, igual que se baja un umbral de
          cobertura. Ponerlo a 0 lo desactiva, y eso tambien deja rastro.
        type: number
        default: 300
      concurrencia-lint:
        description: >-
          Hilos de ESLint. `auto` —uno por nucleo— parece lo obvio y en una
          maquina compartida es como se mata el job: con reglas type-aware CADA
          hilo construye su propio programa de TypeScript, ~3,8 GB. En el VPS
          (4 nucleos, 15 GB) `auto` se lo come entero y el vigilante de memoria
          mata el lint a media faena. Pasa como SIGTERM, sin mensaje que
          explique nada, y parece que el CI «se cuelga».

          2 es el equilibrio medido: casi toda la ganancia de la paralelizacion
          sin acercarse al techo de memoria.
        type: string
        default: "2"
      node-version:
        type: string
        default: "22"
      runs-on:
        description: >-
          Dónde corre. Por defecto los ejecutores de GitHub, que es lo correcto
          para un repositorio público. Un repo PRIVADO con ejecutor propio pasa
          '["self-hosted","linux"]' y deja de gastar minutos del plan: cuando
          esos minutos se agotan los checks no fallan, NO ARRANCAN —el PR se
          queda en rojo sin haber ejecutado nada— y eso enseña a ignorar el
          rojo. En septiembre de 2026 costó una semana de PRs sin verificar.

          El workflow reutilizable corre en el contexto del repo que lo llama,
          así que el ejecutor propio solo ve código de ese repo.
        type: string
        default: '["ubuntu-latest"]'
jobs:
  quality:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ inputs.node-version }}", cache: pnpm }
      # El reloj arranca DESPUES de instalar: lo que se presupuesta es el
      # trabajo de comprobar, no la descarga de dependencias, que depende de si
      # la cache del ejecutor estaba caliente y no de si el codigo esta sano.
      - run: pnpm install --frozen-lockfile
      - id: reloj
        run: echo "inicio=$(date +%s)" >> "$GITHUB_OUTPUT"
      # `--concurrency=auto`: un hilo por núcleo en vez de uno solo.
      #
      # Con reglas que usan tipos, ESLint construye el programa de TypeScript
      # entero, y eso tarda: en `personal-os` —1151 ficheros— el lint completo
      # se iba a **quince minutos** en un solo hilo. Era el paso más lento de
      # todo el CI con diferencia, y el que hacía que cada ronda costara una
      # espera larga.
      #
      # Lo que NO se pone aquí es `--cache`, y es deliberado: la caché de ESLint
      # se invalida por fichero, pero una regla type-aware puede fallar en un
      # fichero que no ha cambiado porque cambió un tipo del que depende. En
      # local eso es un intercambio razonable —se gana velocidad y el CI tiene
      # la última palabra—; aquí, donde esta es la última palabra, un falso
      # verde vale más que los segundos que ahorraría.
      - run: pnpm exec eslint . --concurrency=${{ inputs.concurrencia-lint }} --max-warnings ${{ inputs.max-warnings }}

      # Ciclos de imports, para el repo que los sacó del lint.
      #
      # `--if-present` y no un paso obligatorio: quien siga con `import/no-cycle`
      # dentro de ESLint no tiene este script y no debe fallar por no tenerlo.
      # Quien lo tiene, lo corre — y ahí está el guardia que la regla dejó de
      # dar. Lo que NO puede pasar es que un repo apague la regla y no ponga
      # nada en su sitio: por eso el script se llama igual en todos y este paso
      # existe aquí, en el estándar, y no en cada workflow.
      - run: pnpm ciclos --if-present
      - run: pnpm exec tsc --noEmit
      - if: ${{ inputs.run-tests }}
        run: pnpm test --if-present
      - if: ${{ inputs.knip }}
        run: pnpm exec knip
      - if: ${{ inputs.build }}
        run: pnpm build --if-present

      # ── La regla de oro ────────────────────────────────────────────────────
      #
      # Va al final y con `always()`: un job que falla por lento tambien tiene
      # que decirlo, y si se saltara cuando algo mas ha fallado, el dia que el
      # lint tarde veinte minutos Y falle, solo veriamos lo segundo.
      #
      # Se mide dentro del job y no desde fuera a proposito: la duracion que
      # GitHub muestra incluye esperar a que haya ejecutor libre, y eso no es
      # culpa del codigo. Lo que se presupuesta es lo que este repo puede
      # arreglar.
      - name: Presupuesto de tiempo
        if: ${{ always() && inputs.presupuesto-segundos > 0 }}
        run: |
          tardo=$(( $(date +%s) - ${{ steps.reloj.outputs.inicio }} ))
          techo=${{ inputs.presupuesto-segundos }}
          printf 'comprobaciones: %ss (techo %ss)\n' "$tardo" "$techo"
          if [ "$tardo" -gt "$techo" ]; then
            {
              echo "### Este job tarda demasiado"
              echo ""
              echo "**${tardo}s**, y el techo son **${techo}s**."
              echo ""
              echo "No es un aviso: es un fallo, y a proposito. Un CI lento no se"
              echo "arregla nunca —cada quien que lo sufre decide que hoy no le toca"
              echo "a el— y acaba saltandose. Tenerlo en rojo obliga a mirarlo el dia"
              echo "que se rompe, cuando todavia se sabe que cambio lo rompio."
              echo ""
              echo "Se arregla haciendolo mas rapido. Si de verdad no se puede, se"
              echo "sube \`presupuesto-segundos\` en el PR, con el motivo escrito."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Las comprobaciones tardan ${tardo}s y el techo son ${techo}s."
            exit 1
          fi
