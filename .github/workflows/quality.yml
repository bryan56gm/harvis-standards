# Workflow reutilizable (harvis-standards v2). En cada repo, .github/workflows/ci.yml:
#   jobs:
#     quality:
#       uses: bryan56gm/harvis-standards/.github/workflows/quality.yml@v2
#       with: { run-tests: true, max-warnings: 0, knip: false }
name: quality
on:
  workflow_call:
    inputs:
      run-tests:
        type: boolean
        default: true
      max-warnings:
        description: Trinquete de warnings. 0 cuando el repo sale de `legacy`.
        type: number
        default: 50
      knip:
        description: Código muerto (pnpm knip). Opt-in.
        type: boolean
        default: false
      node-version:
        type: string
        default: "22"
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ inputs.node-version }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint . --max-warnings ${{ inputs.max-warnings }}
      - run: pnpm exec tsc --noEmit
      - if: ${{ inputs.run-tests }}
        run: pnpm test --if-present
      - if: ${{ inputs.knip }}
        run: pnpm exec knip
      - run: pnpm build --if-present
